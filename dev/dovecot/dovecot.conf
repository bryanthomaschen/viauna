# Development-only Dovecot for Wren. NEVER expose this: any user logs in with the
# password "pass", and plaintext auth is allowed. The compose file binds it to 127.0.0.1.
#
# Mirrors what a typical self-hosted stack (Mailu, mailcow, docker-mailserver) offers:
# maildir, special-use folders, CONDSTORE/QRESYNC, IDLE, MOVE, keywords, and LMTP for
# delivery (which dev/smtp-sink.mjs uses to deliver "sent" mail into recipients' inboxes).

mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000
last_valid_uid = 1000

protocols = imap lmtp
listen = *

disable_plaintext_auth = no
auth_mechanisms = plain login

passdb {
  driver = static
  args = password=pass
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu allow_all_users=yes
}

ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

protocol imap {
  mail_max_userip_connections = 50
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
