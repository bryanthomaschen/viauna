name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # The state store is tested on every engine it supports (test/databases.ts), with
    # their data in memory, since the tests rebuild tables constantly.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: viauna, POSTGRES_PASSWORD: viauna, POSTGRES_DB: viauna }
        ports: ["55432:5432"]
        options: --tmpfs /var/lib/postgresql/data --health-cmd "pg_isready -h 127.0.0.1 -U viauna" --health-interval 2s --health-timeout 5s --health-retries 60
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: viauna, MYSQL_USER: viauna, MYSQL_PASSWORD: viauna }
        ports: ["53306:3306"]
        options: --tmpfs /var/lib/mysql --health-cmd "mysqladmin ping -h 127.0.0.1 -uviauna -pviauna --silent" --health-interval 2s --health-timeout 5s --health-retries 90
      mariadb:
        image: mariadb:11.4
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: viauna, MARIADB_USER: viauna, MARIADB_PASSWORD: viauna }
        ports: ["53307:3306"]
        options: --tmpfs /var/lib/mysql --health-cmd "mariadb-admin ping -h 127.0.0.1 -uviauna -pviauna --silent" --health-interval 2s --health-timeout 5s --health-retries 90
      # A directory for password changes over LDAP (test/password.test.ts).
      ldap:
        image: osixia/openldap:1.5.0
        env: { LDAP_ORGANISATION: Viauna, LDAP_DOMAIN: example.test, LDAP_ADMIN_PASSWORD: admin, LDAP_TLS_VERIFY_CLIENT: never }
        ports: ["53389:389"]
        options: --health-cmd "ldapwhoami -x -H ldap://127.0.0.1 -D cn=admin,dc=example,dc=test -w admin" --health-interval 2s --health-timeout 5s --health-retries 60
      # A CardDAV server for contacts sync (test/carddav.test.ts).
      carddav:
        image: tomsquest/docker-radicale:3.5.8.0
        ports: ["55232:5232"]
        options: --tmpfs /data --health-cmd "wget -qO- http://127.0.0.1:5232/.web/" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      VIAUNA_TEST_PG: postgres://viauna:viauna@127.0.0.1:55432/viauna
      VIAUNA_TEST_MYSQL: mysql://viauna:viauna@127.0.0.1:53306/viauna
      VIAUNA_TEST_MARIADB: mariadb://viauna:viauna@127.0.0.1:53307/viauna
      VIAUNA_TEST_LDAP: ldap://127.0.0.1:53389
      VIAUNA_TEST_CARDDAV: http://127.0.0.1:55232
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Version, changelog and docs agree
        run: node dev/release.mjs check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Start the dev mail server
        run: |
          docker compose -f dev/compose.yml up -d
          node dev/smtp-sink.mjs &
          for i in $(seq 1 30); do nc -z 127.0.0.1 1143 && nc -z 127.0.0.1 1587 && break; sleep 1; done
      - name: Integration tests, once per state store
        run: |
          for url in "" "$VIAUNA_TEST_PG" "$VIAUNA_TEST_MYSQL" "$VIAUNA_TEST_MARIADB"; do
            echo "::group::state store: ${url:-sqlite}"
            VIAUNA_TEST_DATABASE_URL="$url" npm run test:integration
            echo "::endgroup::"
          done
      - run: npm run build
      - name: Browser tests (shortcuts and the command menu)
        run: |
          npx playwright-core install --with-deps chromium-headless-shell
          npm run test:browser

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VIAUNA_VERSION=${GITHUB_SHA::7} -t viauna:ci .
