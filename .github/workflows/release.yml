name: Release

# Publishes the container image to ghcr.io/bryanthomaschen/viauna, for linux/amd64 and
# linux/arm64:
#   - a tag vX.Y.Z → X.Y.Z, X.Y and latest, plus a GitHub Release with generated notes;
#   - a push to main → edge and sha-<short>, for trying unreleased changes.
# The tag must match package.json's version, so the version the app shows is the one
# that was tagged. Each published image is then started on native amd64 and arm64
# runners, and the GitHub Release waits for both. How to cut a release:
# docs/development.md.
#
# Third-party actions are pinned to commits, since this job can publish images;
# Dependabot (.github/dependabot.yml) proposes updates.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$pkg" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $pkg. Bump package.json first."
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$pkg-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Multi-platform images keep their description on the index, which is what
          # the registry page shows.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Viauna
            org.opencontainers.image.description=A fast, Gmail-style webmail client for any IMAP/SMTP server.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.documentation=https://bryanthomaschen.github.io/viauna/
          annotations: |
            org.opencontainers.image.title=Viauna
            org.opencontainers.image.description=A fast, Gmail-style webmail client for any IMAP/SMTP server.
            org.opencontainers.image.licenses=AGPL-3.0-only

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VIAUNA_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build provenance and a software bill of materials, attached to the image.
          provenance: mode=max
          sbom: true

  # Pulls the image just published, without logging in (so it also proves the package is
  # public), starts it, and checks it reports the version that was built.
  smoke:
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Start the image and check it answers
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          docker run -d --name viauna -p 127.0.0.1:3000:3000 \
            -e IMAP_HOST=imap.example.test -e SMTP_HOST=smtp.example.test "$IMAGE"
          config=""
          for i in $(seq 1 30); do
            config=$(curl -fsS http://127.0.0.1:3000/api/config) && break
            sleep 1
          done
          echo "$(docker exec viauna uname -m): $config"
          got=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1] or "{}").get("version", ""))' "$config")
          if [[ "$got" != "$VERSION" ]]; then
            echo "::error::Expected version $VERSION, got '$got'"
            docker logs viauna
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          prerelease=()
          [[ "$version" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${prerelease[@]}" \
            --notes "\`\`\`bash
          docker pull ghcr.io/$GITHUB_REPOSITORY:$version
          \`\`\`
          Upgrading: https://bryanthomaschen.github.io/viauna/self-hosting/upgrading"
